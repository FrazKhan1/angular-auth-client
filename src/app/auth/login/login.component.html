<div class="flex h-screen bg-gray-100 mb-14">
  <div
    class="hidden lg:block lg:w-1/2 bg-gradient-to-r from-green-500 to-teal-400 p-12"
  >
    <img
      src="https://res.cloudinary.com/fraz/image/upload/v1746794923/login_ow5wrw.png"
      alt="Login Image"
      class="w-full h-full object-cover rounded-xl"
    />
  </div>

  <div class="w-full lg:w-1/2 flex justify-center items-center p-6">
    <div class="w-full max-w-md space-y-6 bg-white rounded-xl shadow-lg p-8">
      <h2 class="text-2xl font-semibold text-gray-800">Welcome Back</h2>

      <form #form="ngForm" (ngSubmit)="userLogin($event)" class="space-y-4">
        <div class="space-y-4">
          <div>
            <label for="email" class="text-sm font-medium text-gray-600"
              >Email</label
            >
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="Enter your email"
              class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 placeholder:text-sm focus:border-indigo-500 placeholder:text-gray-400"
            />
          </div>

          <div>
            <label for="password" class="text-sm font-medium text-gray-600"
              >Password</label
            >
            <input
              id="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 placeholder:text-sm focus:border-indigo-500 placeholder:text-gray-400"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full mt-6 py-2 bg-teal-600 text-white font-bold rounded-md hover:bg-teal-700 focus:ring-2 focus:ring-teal-500"
        >
          Log In
        </button>

        <p class="mt-4 text-sm text-center text-gray-600">
          Don't have an account?
          <a routerLink="/signup" class="text-teal-600 hover:text-teal-700"
            >Sign Up</a
          >
        </p>
      </form>
    </div>
  </div>
  <div
    *ngIf="isLoading"
    class="fixed inset-0 bg-black/50 bg-opacity-50 z-50 flex items-center justify-center"
  >
    <div
      class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin"
    ></div>
  </div>
</div>
