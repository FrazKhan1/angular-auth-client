<div
  class="flex h-screen mb-14 bg-gray-100"
  *ngIf="!isUserRegisterd; else successTemplate"
>
  <div
    class="hidden lg:block lg:w-1/2 bg-gradient-to-r from-purple-600 to-blue-500 p-12"
  >
    <img
      src="https://res.cloudinary.com/fraz/image/upload/v1746794956/signup_av0o0j.png"
      alt="Signup Image"
      class="w-full h-full object-cover rounded-xl"
    />
  </div>

  <div class="w-full lg:w-1/2 flex justify-center items-center p-6">
    <div class="w-full max-w-md space-y-6 bg-white rounded-xl shadow-lg p-8">
      <h2 class="text-2xl font-semibold text-gray-800">Create Account</h2>

      <form #form="ngForm" (ngSubmit)="userRegister($event)" novalidate>
        <div class="space-y-4">
          <div class="flex gap-3">
            <div>
              <label for="firstName" class="text-sm font-medium text-gray-600"
                >First Name</label
              >
              <input
                [(ngModel)]="firstName"
                id="firstName"
                name="firstName"
                type="text"
                placeholder="Enter your First Name"
                class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 placeholder:text-sm focus:border-indigo-500 placeholder:text-gray-400"
              />
            </div>
            <div>
              <label for="lastName" class="text-sm font-medium text-gray-600"
                >Last Name</label
              >
              <input
                [(ngModel)]="lastName"
                id="lastName"
                name="lastName"
                type="text"
                placeholder="Enter your Last Name"
                class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 placeholder:text-sm focus:border-indigo-500 placeholder:text-gray-400"
              />
            </div>
          </div>
          <div>
            <label for="email" class="text-sm font-medium text-gray-600"
              >Email</label
            >
            <input
              [(ngModel)]="email"
              id="email"
              name="email"
              type="email"
              #emailRef="ngModel"
              required
              placeholder="Enter your email"
              class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 placeholder:text-sm focus:border-indigo-500 placeholder:text-gray-400"
            />
            <div
              *ngIf="emailRef.errors?.['required'] && emailRef.touched"
              class="text-sm text-red-500"
            >
              Email is required.
            </div>
            <div
              *ngIf="emailRef.errors?.['email'] && emailRef.touched"
              class="text-sm text-red-500"
            >
              Enter a valid email.
            </div>
          </div>

          <div>
            <label for="password" class="text-sm font-medium text-gray-600"
              >Password</label
            >
            <input
              [(ngModel)]="password"
              id="password"
              name="password"
              type="password"
              #passwordRef="ngModel"
              required
              minlength="6"
              placeholder="Create a password"
              class="w-full px-4 py-2 mt-1 border border-gray-300 rounded-md focus:ring-indigo-500 placeholder:text-sm focus:border-indigo-500 placeholder:text-gray-400"
            />
            <div
              *ngIf="passwordRef.errors?.['required'] && passwordRef.touched"
              class="text-sm text-red-500"
            >
              Password is required.
            </div>
            <div
              *ngIf="passwordRef.errors?.['minlength'] && passwordRef.touched"
              class="text-sm text-red-500"
            >
              Password must be at least 6 characters.
            </div>
          </div>
        </div>

        <button
          type="submit"
          class="w-full cursor-pointer mt-6 py-2 bg-indigo-600 text-white font-bold rounded-md hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500"
          [disabled]="form.invalid"
        >
          Sign Up
        </button>

        <p class="mt-4 text-sm text-center text-gray-600">
          Already have an account?
          <a routerLink="/login" class="text-indigo-600 hover:text-indigo-700"
            >Login</a
          >
        </p>
      </form>
    </div>
  </div>
</div>

<ng-template #successTemplate>
  <div class="flex items-center justify-center h-screen bg-gray-100 p-6">
    <div class="bg-white p-10 rounded-xl shadow-md text-center max-w-md w-full">
      <h2 class="text-2xl font-bold text-green-600 mb-4">
        Registration Successful!
      </h2>
      <p class="text-gray-700">
        A confirmation link has been sent to your email. <br />
        Please verify your email and then log in.
      </p>
      <a
        routerLink="/login"
        class="inline-block mt-6 px-6 py-2 mr-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
      >
        Go to Login
      </a>
      <button
        (click)="resendVerificationEmail()"
        class="inline-block mt-6 px-6 py-2 bg-indigo-600 text-white font-bold rounded-md hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500"
      >
        Re-send link
      </button>
    </div>
  </div>
</ng-template>

<div
  *ngIf="isLoading"
  class="fixed inset-0 bg-black/50 bg-opacity-50 z-50 flex items-center justify-center"
>
  <div
    class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin"
  ></div>
</div>
