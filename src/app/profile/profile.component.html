<div class="container mx-auto py-12 px-6">
    <form
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-2xl shadow-xl p-8 md:flex md:gap-12 items-start"
      enctype="multipart/form-data"
    >
      <div class="flex-shrink-0 w-full md:w-1/3 flex justify-center mb-8 md:mb-0">
        <label for="profileImage" class="relative cursor-pointer group">
          <img
          [src]="previewUrl || imageUrl"
            alt="Profile"
            class="w-44 h-44 rounded-full object-cover border-4 border-blue-500 shadow-md group-hover:opacity-75 transition"
          />
          <div
            class="absolute bottom-0 right-0 bg-blue-600 p-2 rounded-full shadow group-hover:bg-blue-700 transition"
          >
            <span class="material-icons text-white text-sm">edit</span>
          </div>
          <input
            id="profileImage"
            name="profileImage"
            type="file"
            accept="image/*"
            (change)="onImageSelected($event)"
            class="hidden"
          />
        </label>
      </div>
  
      <!-- Profile Info -->
      <div class="w-full md:w-2/3 space-y-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Edit Profile</h2>
  
        <div>
          <label for="firstName" class="block text-sm font-semibold text-gray-600 mb-1"
            >First Name</label
          >
          <input
            id="firstName"
            name="firstName"
            type="text"
            [(ngModel)]="profile.firstName"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
  
        <div>
          <label for="lastName" class="block text-sm font-semibold text-gray-600 mb-1"
            >Last Name</label
          >
          <input
            id="lastName"
            name="lastName"
            type="text"
            [(ngModel)]="profile.lastName"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
  
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-600 mb-1"
            >Email</label
          >
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="profile.email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>
  
        <div class="pt-4">
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg shadow transition cursor-pointer"
          >
            Save Changes
          </button>
        </div>
      </div>
    </form>
    <div
    *ngIf="isLoading"
    class="fixed inset-0 bg-black/50 bg-opacity-50 z-50 flex items-center justify-center"
  >
    <div
      class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin"
    ></div>
  </div>
  </div>
